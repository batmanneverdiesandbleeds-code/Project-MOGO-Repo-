<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Global Styles & Branding */
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Share+Tech+Mono&display=swap');
    
    .font-heavy { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
    .font-tech { font-family: 'Share Tech Mono', monospace; }
    
    .bg-grunge {
      background-color: #050605;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 40, 30, 0.3) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.4) 2px, rgba(0,0,0,0.4) 4px);
      color: #9ca3af;
    }
    
    .text-neon-green { color: #76ff03; text-shadow: 0 0 10px rgba(118, 255, 3, 0.5); }
    .text-gold { color: #ffb700; text-shadow: 0 0 10px rgba(255, 183, 0, 0.4); }

    .diamond-icon {
      width: 14px; height: 14px; background-color: #3b82f6;
      transform: rotate(45deg); display: inline-block;
      box-shadow: 0 0 10px #3b82f6;
    }

    /* Glassmorphism adaptation of panel-armor */
    .glass-armor {
      background: linear-gradient(135deg, rgba(22, 24, 22, 0.85) 0%, rgba(10, 11, 10, 0.95) 100%);
      backdrop-filter: blur(12px);
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      position: relative;
    }
    
    .glass-armor-green { border: 2px solid rgba(118, 255, 3, 0.3); }
    .glass-armor-yellow { border: 2px solid rgba(255, 183, 0, 0.6); box-shadow: inset 0 0 20px rgba(255,183,0,0.1); }
    .glass-armor-red { border: 2px solid rgba(255, 51, 51, 0.8); box-shadow: inset 0 0 30px rgba(255,51,51,0.2); }
    
    .btn-heavy {
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      font-family: 'Oswald', sans-serif; text-transform: uppercase;
    }
    
    svg.lucide { stroke-width: 2; fill: none; stroke: currentColor; }
  </style>
</head>
<body class="bg-grunge text-gray-300 font-tech p-4 md:p-6 lg:p-8 min-h-screen">

  <!-- Header -->
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b-2 border-[#232a23] mb-8">
    <div>
      <div class="flex items-center gap-3 mb-1">
        <div class="diamond-icon"></div>
        <h1 class="text-4xl font-heavy text-blue-400 tracking-widest drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]">CREW HEALTH ROSTER</h1>
      </div>
      <p class="text-sm text-gray-400 mt-1">Chief Medical Officer (CMO) Command Overview</p>
    </div>
    <div class="mt-4 md:mt-0">
       <button class="btn-heavy bg-[#232a23] text-gray-300 px-6 py-2 border border-[#4a544a] hover:bg-[#333e33] transition-colors" onclick="window.location.href='index.html'">
          RETURN TO MAIN DASHBOARD
       </button>
    </div>
  </header>

  <main>
     <div id="roster-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-2 gap-8">
        <!-- Rendered by JS -->
     </div>
  </main>

  <script>
    // 1. Crew Data & Triage Sorting
    const crewData = [
      {
        id: "crew-1",
        name: "Cmdr. S. Mitchell",
        role: "Commander",
        location: "Command Deck - Cupola",
        statusLevel: "green",
        physical: "NOMINAL",
        hr: "72 BPM",
        rad: "0.1 mSv/h",
        bhp: "Optimal / Sleep Debt: 0hrs",
        alertText: "ALL SYSTEMS NOMINAL",
        priority: 3
      },
      {
        id: "crew-2",
        name: "Dr. A. Vance",
        role: "Chief Medical Officer",
        location: "In Sleep Quarters - Node 2",
        statusLevel: "yellow",
        physical: "MONITOR - MILD DEHYDRATION",
        hr: "68 BPM",
        rad: "0.1 mSv/h",
        bhp: "High Mission Fatigue / Sleep Debt: 4hrs",
        alertText: "MONITOR: CIRCADIAN DISRUPTION DETECTED",
        priority: 2
      },
      {
        id: "crew-3",
        name: "Eng. K. Thorne",
        role: "Flight Engineer",
        location: "Currently on Extravehicular Activity (EVA) - Airlock 2 Exterior",
        statusLevel: "red",
        physical: "CRITICAL DEGRADATION",
        hr: "142 BPM",
        rad: "1.4 mSv/h (ELEVATED)",
        bhp: "Severe Exhaustion / Sleep Debt: 7hrs",
        alertText: "INTERVENTION REQUIRED: ELEVATED HR & HIGH FATIGUE DURING EVA",
        priority: 1
      },
      {
        id: "crew-4",
        name: "Spec. J. Carver",
        role: "Payload Specialist",
        location: "Destiny Laboratory - Rack 4",
        statusLevel: "green",
        physical: "NOMINAL",
        hr: "65 BPM",
        rad: "0.1 mSv/h",
        bhp: "Optimal / Sleep Debt: 1hrs",
        alertText: "ALL SYSTEMS NOMINAL",
        priority: 3
      }
    ];

    function renderRoster() {
      // Sort by priority (1 is highest/critical)
      const sorted = [...crewData].sort((a, b) => a.priority - b.priority);
      const container = document.getElementById('roster-grid');
      container.innerHTML = '';

      sorted.forEach(crew => {
        let borderClass, alertHTML, actionsHTML;
        
        // 2. Alert System & Dynamic Styling
        if (crew.statusLevel === 'red') {
          borderClass = 'glass-armor-red';
          alertHTML = `
            <div class="bg-red-950/50 border border-red-500 p-3 flex items-center gap-3 animate-pulse">
               <svg class="lucide w-6 h-6 text-red-500 shrink-0" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
               <span class="font-heavy text-red-500 tracking-widest text-sm">${crew.alertText}</span>
            </div>
          `;
          actionsHTML = `
            <button id="dispatch-${crew.id}" onclick="dispatchCMO('dispatch-${crew.id}')" class="flex-1 py-3 btn-heavy bg-[#ff3333] hover:bg-red-500 text-white font-heavy text-sm tracking-widest transition-colors shadow-[0_0_15px_rgba(255,51,51,0.4)] flex justify-center items-center gap-2">
               DISPATCH MEDICAL OFFICER
            </button>
            <button onclick="initiateComms(this)" class="flex-1 py-3 btn-heavy bg-transparent border-2 border-[#ff3333] text-[#ff3333] hover:bg-[#ff3333]/10 font-heavy text-sm tracking-widest transition-colors flex justify-center items-center gap-2">
               INITIATE PRIVATE COMMS
            </button>
          `;
        } else if (crew.statusLevel === 'yellow') {
          borderClass = 'glass-armor-yellow';
          alertHTML = `
            <div class="bg-yellow-950/40 border border-yellow-600 p-3 flex items-center gap-3">
               <svg class="lucide w-6 h-6 text-gold shrink-0" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
               <span class="font-heavy text-gold tracking-widest text-sm">${crew.alertText}</span>
            </div>
          `;
          actionsHTML = `
            <button id="dispatch-${crew.id}" onclick="dispatchCMO('dispatch-${crew.id}')" class="flex-1 py-3 btn-heavy bg-[#ffb700] hover:bg-yellow-400 text-black font-heavy text-sm tracking-widest transition-colors shadow-[0_0_15px_rgba(255,183,0,0.4)] flex justify-center items-center gap-2">
               DISPATCH MEDICAL OFFICER
            </button>
            <button onclick="initiateComms(this)" class="flex-1 py-3 btn-heavy bg-transparent border-2 border-[#ffb700] text-[#ffb700] hover:bg-[#ffb700]/10 font-heavy text-sm tracking-widest transition-colors flex justify-center items-center gap-2">
               INITIATE PRIVATE COMMS
            </button>
          `;
        } else {
          borderClass = 'glass-armor-green';
          alertHTML = ``;
          actionsHTML = `
            <button class="w-full py-3 btn-heavy bg-[#232a23] text-gray-400 border border-[#4a544a] hover:text-[#76ff03] hover:border-[#76ff03] font-heavy text-sm tracking-widest transition-colors flex justify-center items-center gap-2">
               <svg class="lucide w-4 h-4" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
               VIEW DETAILED LOGS
            </button>
          `;
        }

        // 3. Construct the Card
        container.innerHTML += `
          <div class="glass-armor ${borderClass} flex flex-col justify-between p-0 overflow-hidden transform hover:-translate-y-1 transition-transform duration-300">
             
             <!-- Card Header -->
             <div class="p-6 border-b border-[#232a23] bg-black/40 flex justify-between items-start">
                <div>
                   <h2 class="text-2xl font-heavy ${crew.statusLevel === 'red' ? 'text-red-500' : 'text-gray-200'} tracking-wider">${crew.name}</h2>
                   <p class="font-tech text-gray-500 text-sm mt-1">${crew.role}</p>
                </div>
                <!-- Status Pip -->
                <div class="flex flex-col items-end">
                   <div class="w-3 h-3 rounded-full ${crew.statusLevel === 'red' ? 'bg-red-500 animate-pulse shadow-[0_0_10px_red]' : (crew.statusLevel === 'yellow' ? 'bg-gold shadow-[0_0_10px_orange]' : 'bg-neon-green shadow-[0_0_10px_lime]')}"></div>
                </div>
             </div>

             <!-- Card Body -->
             <div class="p-6 space-y-6 flex-1">
                
                <div class="flex items-center gap-2 text-gray-400 text-sm italic border-l-2 border-gray-600 pl-3">
                   <svg class="lucide w-4 h-4 shrink-0" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                   <span>${crew.location}</span>
                </div>

                <!-- Vitals Grid -->
                <div class="grid grid-cols-2 gap-4">
                   <div class="bg-black/50 p-4 border border-[#232a23]">
                      <h3 class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Physical Condition</h3>
                      <p class="font-heavy text-sm ${crew.statusLevel === 'red' ? 'text-red-400' : 'text-gray-300'} mb-3">${crew.physical}</p>
                      
                      <div class="flex justify-between items-center text-xs font-tech text-gray-400 mb-1 border-b border-[#232a23] pb-1">
                         <span>Heart Rate:</span> <span class="${crew.statusLevel === 'red' ? 'text-red-500 font-bold' : 'text-neon-green'}">${crew.hr}</span>
                      </div>
                      <div class="flex justify-between items-center text-xs font-tech text-gray-400">
                         <span>Radiation:</span> <span class="${crew.statusLevel === 'red' ? 'text-gold' : 'text-blue-400'}">${crew.rad}</span>
                      </div>
                   </div>

                   <div class="bg-black/50 p-4 border border-[#232a23]">
                      <h3 class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2">Behavioral Health</h3>
                      <p class="font-tech text-sm text-gray-300">${crew.bhp}</p>
                   </div>
                </div>

                <!-- Alert Banner (Dynamic) -->
                ${alertHTML}

             </div>

             <!-- Card Footer (Actions) -->
             <div class="p-6 pt-0 flex flex-col sm:flex-row gap-4">
                ${actionsHTML}
             </div>
             
          </div>
        `;
      });
    }

    // 4. CMO Interactive Actions
    function dispatchCMO(buttonId) {
      const btn = document.getElementById(buttonId);
      
      // Spinner State
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        DISPATCHING...
      `;
      btn.classList.add('pointer-events-none', 'bg-[#232a23]', 'text-white');
      btn.classList.remove('bg-[#ff3333]', 'bg-[#ffb700]', 'text-black');
      
      setTimeout(() => {
        btn.innerHTML = `
          <svg class="lucide w-4 h-4 text-white" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
          CMO EN ROUTE
        `;
        btn.classList.remove('bg-[#232a23]');
        btn.classList.add('bg-blue-500', 'shadow-[0_0_15px_rgba(59,130,246,0.5)]');
      }, 1500);
    }

    function initiateComms(btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = `ESTABLISHING SECURE LINK...`;
      btn.classList.add('pointer-events-none', 'bg-black');
      
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove('pointer-events-none', 'bg-black');
      }, 2000);
    }

    // Init
    renderRoster();
  </script>
</body>
</html>
